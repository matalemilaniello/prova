name: Pubblica su GitHub Pages

on:
  push:
    branches:
      - main
      - claude/focused-mendel-tgcz8o
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Prepara Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Controlla i tipi
        run: npm run typecheck

      - name: Test dei motori
        run: npm test

      - name: Build per GitHub Pages
        run: npm run build

      - name: Pubblica sul ramo gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Pubblica ${{ github.sha }}'
